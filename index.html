<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hours Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6ED;
    --panel:#FFFFFF;
    --lavender:#F0EAFB;
    --lavender-line:#E4DAF7;
    --dandelion:#FFD166;
    --dandelion-deep:#F5B93F;
    --mint:#AEE6D3;
    --mint-deep:#7FCDBB;
    --skyblue:#AAD4F5;
    --skyblue-deep:#5B9FD9;
    --coral:#FF7A70;
    --coral-bg:#FFE3E0;
    --plum:#4A3F55;
    --plum-soft:#8B7F99;
    --pink:#FFD6E8;
    --shadow: 0 10px 30px rgba(74,63,85,0.12);
    --radius-lg: 28px;
    --radius-md: 18px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 12%, #FFF1DA 0%, transparent 40%),
      radial-gradient(circle at 92% 8%, #E7F7F1 0%, transparent 38%),
      radial-gradient(circle at 85% 90%, #F5E9FF 0%, transparent 42%),
      var(--cream);
    font-family:'Quicksand', sans-serif;
    color:var(--plum);
    padding: 18px 16px 60px;
  }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin: 6px 0 28px;
  }
  header.top .blob-icon{
    font-size: 30px;
    transform: rotate(-8deg);
  }
  header.top h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: clamp(22px, 5vw, 30px);
    margin:0;
    letter-spacing: 0.5px;
  }
  .month-label{
    text-align:center;
    color: var(--plum-soft);
    font-weight:600;
    margin: -18px 0 26px;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* HERO CIRCLE */
  .hero{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap: wrap;
    gap: 48px;
    margin-bottom: 34px;
  }
  .circle-holder{
    position:relative;
    width: clamp(210px, 46vw, 270px);
    height: clamp(210px, 46vw, 270px);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.018); }
  }
  .ring-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform: rotate(-90deg);
  }
  .ring-track{
    fill:none;
    stroke: rgba(74,63,85,0.08);
    stroke-width: 8;
  }
  .ring-progress{
    fill:none;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease, stroke 0.6s ease;
  }
  .budget-ring-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform: rotate(-90deg);
    overflow: visible;
  }
  .budget-ring-track{
    fill:none;
    stroke: rgba(74,63,85,0.07);
    stroke-width: 5;
  }
  .ring-segment{
    fill:none;
    stroke-width: 5;
    transition: stroke-dasharray 0.6s ease, stroke-dashoffset 0.6s ease;
  }
  .circle-fill.overage-fill{
    background: radial-gradient(circle at 32% 28%, #FFD9D4 0%, var(--coral) 55%, #E1483A 100%);
    box-shadow: inset 0 -10px 18px rgba(0,0,0,0.06), 0 14px 26px rgba(255,122,112,0.4);
  }
  .circle-fill.overage-fill.overage-safe{
    background: radial-gradient(circle at 32% 28%, #DFF3E7 0%, #6FBE8E 55%, #3E9265 100%);
    box-shadow: inset 0 -10px 18px rgba(0,0,0,0.06), 0 14px 26px rgba(111,190,142,0.4);
  }
  .overage-holder{
    display:none;
  }
  .circle-fill{
    width: 78%;
    height: 78%;
    border-radius: 50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background: radial-gradient(circle at 32% 28%, #E4F3FD 0%, var(--skyblue) 55%, var(--skyblue-deep) 100%);
    box-shadow: inset 0 -10px 18px rgba(0,0,0,0.07), 0 14px 26px rgba(91,159,217,0.35);
    transition: background 0.7s ease, box-shadow 0.7s ease;
    padding: 10px;
    position: relative;
    overflow: visible;
    cursor: pointer;
  }
  .circle-fill.over-goal{
    background: radial-gradient(circle at 32% 28%, #FFE6A8 0%, var(--dandelion) 55%, var(--dandelion-deep) 100%);
    box-shadow: inset 0 -10px 18px rgba(0,0,0,0.06), 0 14px 26px rgba(245,185,63,0.4);
  }
  .circle-number{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(38px, 11vw, 54px);
    line-height:1;
  }
  .circle-caption{
    font-weight:600;
    font-size: clamp(12px, 3vw, 14px);
    margin-top: 6px;
    max-width: 140px;
    opacity: 0.85;
  }
  .circle-caption.hidden{
    display:none;
  }
  .circle-pop{
    animation: pop 0.45s ease;
  }
  @keyframes pop{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.09); }
    100%{ transform: scale(1); }
  }

  .confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:9999;
  }
  .confetti-piece{
    position:fixed;
    top:0;
    left:0;
    width:11px;
    height:20px;
    margin:-10px 0 0 -5px;
    opacity:1;
    animation: confetti-burst 1300ms cubic-bezier(0.15,0.8,0.3,1) forwards;
  }
  @keyframes confetti-burst{
    0%{ transform: translate(0,0) rotate(0deg) scale(1); opacity:1; }
    75%{ opacity:1; }
    100%{ transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.55); opacity:0; }
  }

  /* WIDGETS */
  .widgets{
    display:grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: 34px;
  }
  @media (min-width: 680px){
    .widgets{ grid-template-columns: repeat(3, 1fr); }
  }
  .widget{
    background: var(--panel);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    padding: 18px 16px;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    min-height: 108px;
  }
  .widget .w-label{
    font-size: 12.5px;
    font-weight:700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--plum-soft);
  }
  .widget .w-value{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 30px;
    color: var(--plum);
    transition: color 0.3s ease;
  }
  .widget.alert .w-value{
    color: var(--coral);
  }
  .widget.alert{
    background: var(--coral-bg);
  }
  .widget.log-widget{
    background: linear-gradient(160deg, var(--pink), #FCE8F2);
    cursor:pointer;
    border: none;
    align-items:center;
  }
  .widget.log-widget .w-plus{
    font-family:'Baloo 2', sans-serif;
    font-size: 36px;
    line-height:1;
  }
  .widget.log-widget .w-label{ color: #A85C82; }
  .widget.log-widget:hover{ transform: translateY(-2px); box-shadow: 0 14px 26px rgba(168,92,130,0.25); }
  .widget.log-widget{ transition: transform 0.2s ease, box-shadow 0.2s ease; }

  /* CALENDAR */
  .calendar-section{
    background: var(--panel);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 22px 18px 26px;
    margin-bottom: 26px;
    transition: background-color 0.4s ease;
  }
  .calendar-section.confetti-bg{
    background-color: var(--panel);
    background-image:
      radial-gradient(circle, #FFD166 3px, transparent 3.5px),
      radial-gradient(circle, #FF8577 3px, transparent 3.5px),
      radial-gradient(circle, #AEE6D3 3px, transparent 3.5px),
      radial-gradient(circle, #AAD4F5 3px, transparent 3.5px),
      radial-gradient(circle, #FFD6E8 3px, transparent 3.5px),
      radial-gradient(circle, #C9B6F2 3px, transparent 3.5px);
    background-repeat: repeat;
    background-size: 46px 46px;
    background-position: 0 0, 12px 20px, 24px 6px, 36px 30px, 6px 34px, 30px 12px;
  }
  .calendar-section h2{
    font-family:'Baloo 2', sans-serif;
    font-size: 19px;
    margin: 0 0 16px;
    text-align:center;
  }
  .cal-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-dow{
    text-align:center;
    font-size: 11px;
    font-weight:700;
    color: var(--plum-soft);
    text-transform: uppercase;
    padding-bottom: 4px;
  }
  .cal-cell{
    position:relative;
    aspect-ratio: 1/1;
    border-radius: 10px;
    background: var(--lavender);
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    padding: 4px 6px;
    font-size: clamp(10px, 2.6vw, 12px);
    font-weight:600;
    color: var(--plum-soft);
  }
  .cal-cell.empty{
    background: transparent;
  }
  .cal-cell.logged{
    color: #1f4a3d;
    cursor: pointer;
    font-weight:700;
  }
  .cal-cell.today{
    outline: 2px solid var(--dandelion-deep);
    outline-offset: -2px;
  }
  .tooltip{
    position: fixed;
    z-index: 999;
    background: var(--plum);
    color: #fff;
    padding: 10px 13px;
    border-radius: 12px;
    font-size: 13px;
    font-weight:600;
    max-width: 220px;
    box-shadow: 0 10px 22px rgba(0,0,0,0.25);
    pointer-events:none;
    opacity:0;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .tooltip.show{ opacity:1; transform: translateY(0); }
  .tooltip .tt-hours{ color: var(--dandelion); margin-bottom:3px; }
  .tooltip .tt-desc{ font-weight:500; color:#EDE7F5; }

  /* ARCHIVE BUTTON */
  .archive-link-wrap{
    display:flex;
    justify-content:center;
    margin-bottom: 10px;
  }
  .archive-btn{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 15px;
    color: var(--plum);
    background: var(--lavender);
    border: 2px solid var(--lavender-line);
    padding: 13px 30px;
    border-radius: 999px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .archive-btn:hover{
    background: #E5DBFB;
    transform: translateY(-2px);
  }

  /* SYNC STATUS */
  .sync-wrap{
    text-align:center;
    margin-bottom: 22px;
  }
  .sync-badge{
    display:inline-block;
    font-size: 11.5px;
    font-weight:700;
    color: var(--plum-soft);
    background: var(--lavender);
    border: 1px solid var(--lavender-line);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .sync-hint{
    max-width: 360px;
    margin: 8px auto 0;
    font-size: 11.5px;
    color: var(--plum-soft);
    font-weight:600;
    line-height:1.4;
  }

  /* LOCK SCREEN */
  body.app-locked > *:not(.lock-overlay){
    filter: blur(14px);
    pointer-events: none;
    user-select: none;
  }
  .lock-overlay{
    position:fixed;
    inset:0;
    z-index: 99999;
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    background:
      radial-gradient(circle at 8% 10%, #FFF1DA 0%, transparent 40%),
      radial-gradient(circle at 92% 6%, #E7F7F1 0%, transparent 38%),
      radial-gradient(circle at 85% 92%, #F5E9FF 0%, transparent 42%),
      var(--cream);
  }
  .lock-overlay.show{ display:flex; }
  .lock-card{
    background: var(--panel);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 34px 28px;
    text-align:center;
    width: 100%;
    max-width: 300px;
  }
  .lock-emoji{ font-size: 34px; margin-bottom: 8px; }
  .lock-card h2{
    font-family:'Baloo 2', sans-serif;
    font-size: 20px;
    margin: 0 0 18px;
  }
  .lock-input{
    width:100%;
    text-align:center;
    letter-spacing: 10px;
    font-size: 22px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    padding: 12px 10px;
    border-radius: 14px;
    border: 2px solid var(--lavender-line);
    background: var(--lavender);
    color: var(--plum);
    outline:none;
  }
  .lock-input:focus{ border-color: var(--dandelion-deep); }
  .lock-input.shake{ animation: lock-shake 0.4s ease; }
  @keyframes lock-shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-8px); }
    75%{ transform: translateX(8px); }
  }
  .lock-error{
    min-height: 18px;
    font-size: 12.5px;
    font-weight:700;
    color: var(--coral, #FF7A70);
    margin-top: 8px;
  }
  .lock-btn{
    width:100%;
    margin-top: 12px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 14.5px;
    padding: 12px 14px;
    border-radius: 999px;
    border:none;
    cursor:pointer;
    background: linear-gradient(135deg, var(--dandelion), var(--dandelion-deep));
    color: #4A3510;
    transition: transform 0.15s ease;
  }
  .lock-btn:hover{ transform: translateY(-1px); }

  /* MODAL */
  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(74,63,85,0.35);
    backdrop-filter: blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 1000;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.open{
    opacity:1;
    pointer-events:auto;
  }
  .modal{
    background: var(--panel);
    border-radius: var(--radius-lg);
    padding: 26px 24px 22px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    transform: scale(0.94) translateY(10px);
    transition: transform 0.25s ease;
  }
  .modal-overlay.open .modal{
    transform: scale(1) translateY(0);
  }
  .modal h3{
    font-family:'Baloo 2', sans-serif;
    margin: 0 0 18px;
    font-size: 21px;
    text-align:center;
  }
  .field{
    margin-bottom: 14px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field label{
    font-size: 12.5px;
    font-weight:700;
    color: var(--plum-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input, .field textarea, .field select{
    font-family:'Quicksand', sans-serif;
    font-size: 15px;
    font-weight:600;
    color: var(--plum);
    border: 2px solid var(--lavender-line);
    background: var(--lavender);
    border-radius: 12px;
    padding: 10px 12px;
    outline:none;
    transition: border-color 0.2s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    border-color: var(--dandelion-deep);
  }
  .field textarea{ resize: vertical; min-height: 60px; font-family:'Quicksand', sans-serif; }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top: 18px;
  }
  .btn{
    flex:1;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 14.5px;
    padding: 12px 14px;
    border-radius: 999px;
    border:none;
    cursor:pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn-cancel{
    background: var(--lavender);
    color: var(--plum);
  }
  .btn-save{
    background: linear-gradient(135deg, var(--dandelion), var(--dandelion-deep));
    color: #4A3510;
  }

  footer.note{
    text-align:center;
    font-size: 12px;
    color: var(--plum-soft);
    margin-top: 18px;
  }
</style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-emoji">🔒</div>
    <h2>Enter Code</h2>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="lockInput" class="lock-input" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" placeholder="•••••" required>
      <div class="lock-error" id="lockError"></div>
      <button type="submit" class="lock-btn">Unlock</button>
    </form>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <span class="blob-icon">🌼</span>
    <h1>Hours Tracker</h1>
  </header>
  <div class="month-label" id="monthLabel">August 2026</div>

  <div class="hero" id="heroSection">
    <div class="circle-holder" id="circleHolder">
      <svg class="budget-ring-svg" id="budgetRingSvg" viewBox="0 0 200 200">
        <circle class="budget-ring-track" cx="100" cy="100" r="97"></circle>
      </svg>
      <svg class="ring-svg" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="92"></circle>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="92"></circle>
      </svg>
      <div class="circle-fill" id="circleFill">
        <div class="circle-number" id="circleNumber">90</div>
        <div class="circle-caption" id="circleCaption">hours left this month</div>
      </div>
    </div>

    <div class="circle-holder overage-holder" id="overageHolder">
      <svg class="budget-ring-svg" id="overageRingSvg" viewBox="0 0 200 200">
        <circle class="budget-ring-track" cx="100" cy="100" r="97"></circle>
      </svg>
      <div class="circle-fill overage-fill" id="overageFill">
        <div class="circle-number" id="overageNumber">0</div>
      </div>
    </div>
  </div>

  <div class="widgets">
    <div class="widget" id="weekWidget">
      <div class="w-label">This Week</div>
      <div class="w-value" id="weekValue">0h</div>
    </div>
    <div class="widget" id="avgWidget">
      <div class="w-label">Avg Weekly (Year)</div>
      <div class="w-value" id="avgValue">0h</div>
    </div>
    <div class="widget log-widget" id="logOpenBtn" aria-label="Log money" title="Log money">
      <div class="w-plus">＋</div>
    </div>
  </div>

  <div class="calendar-section">
    <h2 id="calTitle">August 2026</h2>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="archive-link-wrap">
    <a href="archive.html" class="archive-btn">🗂️ Open Archive</a>
  </div>

  <div class="sync-wrap">
    <div class="sync-badge" id="syncBadge">💾 Saved on this device only</div>
    <div class="sync-hint" id="syncHint">Add a Firebase config in the code to sync across devices.</div>
  </div>

  <footer class="note">Goal: 90 hours · resets automatically each month</footer>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-hours" id="ttHours"></div>
  <div class="tt-desc" id="ttDesc"></div>
</div>

<div class="confetti-layer" id="confettiLayer"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Log Hours 📝</h3>
    <form id="logForm">
      <div class="field">
        <label for="fDate">Date</label>
        <input type="date" id="fDate" required>
      </div>
      <div class="field">
        <label for="fHours">Hours Worked</label>
        <input type="number" id="fHours" min="0" step="0.25" placeholder="e.g. 3.5" required>
      </div>
      <div class="field">
        <label for="fDesc">Task Description</label>
        <textarea id="fDesc" placeholder="What did you work on?" required></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-save">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="budgetModalOverlay">
  <div class="modal">
    <h3>Log Money</h3>
    <form id="budgetForm">
      <div class="field">
        <label for="bAmount">Amount</label>
        <input type="number" id="bAmount" step="0.01" placeholder="e.g. 45.50 or -20" required>
      </div>
      <div class="field">
        <label for="bCategory">Category</label>
        <select id="bCategory" required>
          <option value="savings" style="color:#8B6FC9;">Savings</option>
          <option value="loans" style="color:#3F76B8;">Loans</option>
          <option value="groceries" style="color:#3E9265;">Groceries</option>
          <option value="gas" style="color:#B8860B;">Gas</option>
          <option value="food" style="color:#D9772E;">Food</option>
          <option value="subscription" style="color:#000000;">Subscription</option>
          <option value="other" style="color:#D14A3E;">Other</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" id="budgetCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-save">Add</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  // ============================================================
  // CLOUD SYNC CONFIG — paste your Firebase project config below.
  // Firebase Console → Project settings → General → Your apps → SDK setup.
  // Leave apiKey empty to run in local-only mode (no sync between devices).
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyB6YfMs93UjoVAj6Jd0OsOP2FXLf9mAL7Y",
    authDomain: "beepaboop600.firebaseapp.com",
    projectId: "beepaboop600",
    storageBucket: "beepaboop600.firebasestorage.app",
    messagingSenderId: "341983136727",
    appId: "1:341983136727:web:6364e709fe1737e3c75992"
  
};
  // A "folder name" for your data in the shared database. Change this to
  // any string only you know if you want a little extra obscurity.
  const SYNC_KEY = "my-hours-tracker";
  // ============================================================

  const STORAGE_KEY = 'hourTrackerEntries_v1';
  const BUDGET_KEY = 'hourTrackerBudget_v1';
  const BUDGET_ARCHIVE_KEY = 'hourTrackerBudgetArchive_v1';
  const GOAL = 90;
  const RING_R = 92;
  const RING_CIRC = 2 * Math.PI * RING_R;
  const BUDGET_RING_R = 97;
  const BUDGET_GOAL = 3600;
  const CATEGORIES = [
    { key:'savings',   label:'Savings',    color:'#B79CED' }, // purple
    { key:'loans',     label:'Loans',      color:'#4F86C6' }, // blue
    { key:'groceries', label:'Groceries',  color:'#6FBE8E' }, // green
    { key:'gas',       label:'Gas',        color:'#FFD166' }, // yellow
    { key:'food',      label:'Food',       color:'#FF9F5A' }, // orange
    { key:'subscription', label:'Subscription', color:'#000000' }, // black — auto-renews each month
    { key:'other',     label:'Other',      color:'#FF6B6B' }  // red
  ];

  let entries = [];
  let budgetData = null;      // { month:'YYYY-MM', categories:{...}, total:number }
  let budgetArchive = {};     // { 'YYYY-MM': { total, categories, percentages } }
  let cloudEnabled = false;
  let persist = () => { writeLocal(entries); writeLocalBudget(budgetData); writeLocalBudgetArchive(budgetArchive); }; // reassigned below if cloud is enabled

  function emptyCategories(){
    const c = {};
    CATEGORIES.forEach(cat => c[cat.key] = 0);
    return c;
  }
  function currentMonthKey(){
    return `${curYear}-${String(curMonth+1).padStart(2,'0')}`;
  }
  function readLocalBudget(){
    try{
      const raw = localStorage.getItem(BUDGET_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function writeLocalBudget(b){
    if(b) localStorage.setItem(BUDGET_KEY, JSON.stringify(b));
  }
  function readLocalBudgetArchive(){
    try{
      const raw = localStorage.getItem(BUDGET_ARCHIVE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function writeLocalBudgetArchive(a){
    localStorage.setItem(BUDGET_ARCHIVE_KEY, JSON.stringify(a || {}));
  }
  // If the stored running total belongs to a previous month, snapshot it
  // into the archive (with each category's % of that month's total) and
  // start a fresh total for the current month. "Subscription" is the only
  // category that automatically re-applies into the new month; every other
  // category resets to zero. Returns true if it rolled.
  function applyBudgetRollover(){
    const key = currentMonthKey();
    if(!budgetData){
      budgetData = { month: key, categories: emptyCategories(), total: 0 };
      return false;
    }
    if(budgetData.month === key) return false;

    const oldTotal = Number(budgetData.total) || 0;
    const oldCats = budgetData.categories || emptyCategories();
    const percentages = {};
    CATEGORIES.forEach(c => {
      const val = Number(oldCats[c.key]) || 0;
      percentages[c.key] = oldTotal !== 0 ? (val / oldTotal) * 100 : 0;
    });
    budgetArchive = Object.assign({}, budgetArchive, {
      [budgetData.month]: { total: oldTotal, categories: oldCats, percentages }
    });

    const freshCategories = emptyCategories();
    const subscriptionCarry = Number(oldCats.subscription) || 0;
    freshCategories.subscription = subscriptionCarry;

    budgetData = { month: key, categories: freshCategories, total: subscriptionCarry };
    return true;
  }
  function fmtMoney(n){
    const sign = n < 0 ? '-' : '';
    return `${sign}$${Math.abs(Math.round(n * 100) / 100).toFixed(2)}`;
  }

  function readLocal(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function writeLocal(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function readSeedEntries(){ return []; } // reserved (no longer used)
  function mergedLocal(){
    return readLocal();
  }

  function setSyncBadge(){
    const badge = document.getElementById('syncBadge');
    const hint = document.getElementById('syncHint');
    if(!badge) return;
    if(cloudEnabled){
      badge.textContent = '☁️ Synced across devices';
      hint.textContent = '';
    } else {
      badge.textContent = '💾 Saved on this device only';
      hint.textContent = 'Add a Firebase config in the code to sync across devices.';
    }
  }

  function fmtNum(n){
    n = Math.round(n * 100) / 100;
    return (n % 1 === 0) ? String(n) : String(n.toFixed(2)).replace(/0+$/,'').replace(/\.$/,'');
  }
  // Main-page visuals truncate (not round) decimals — the underlying data
  // keeps full precision, this is display-only.
  function truncNum(n){
    return String(Math.trunc(n));
  }
  function dateKey(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  const now = new Date();
  const curYear = now.getFullYear();
  const curMonth = now.getMonth(); // 0-indexed
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  document.getElementById('monthLabel').textContent = `${monthNames[curMonth]} ${curYear}`;
  document.getElementById('calTitle').textContent = `${monthNames[curMonth]} ${curYear}`;
  document.getElementById('fDate').value = dateKey(now);
  document.getElementById('fDate').max = dateKey(now);

  function entriesForCurrentMonth(all){
    return all.filter(e => {
      const d = new Date(e.date + 'T00:00:00');
      return d.getFullYear() === curYear && d.getMonth() === curMonth;
    });
  }

  function startOfWeek(d){
    const copy = new Date(d);
    copy.setHours(0,0,0,0);
    const day = copy.getDay(); // 0 = Sunday
    copy.setDate(copy.getDate() - day);
    return copy;
  }
  function endOfWeek(d){
    const s = startOfWeek(d);
    const e = new Date(s);
    e.setDate(e.getDate() + 6);
    e.setHours(23,59,59,999);
    return e;
  }

  // Average hours per week, across the whole current year, counting only
  // the span from the first logged week through the last logged week
  // (no padding from empty weeks before the first log or after the last).
  function computeYearlyWeeklyAvg(all){
    const yearEntries = all.filter(e => new Date(e.date + 'T00:00:00').getFullYear() === curYear);
    if(yearEntries.length === 0) return 0;

    let minDate = null, maxDate = null;
    yearEntries.forEach(e => {
      const d = new Date(e.date + 'T00:00:00');
      if(!minDate || d < minDate) minDate = d;
      if(!maxDate || d > maxDate) maxDate = d;
    });

    const firstWeekStart = startOfWeek(minDate);
    const lastWeekStart = startOfWeek(maxDate);
    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
    const weekSpan = Math.round((lastWeekStart - firstWeekStart) / msPerWeek) + 1;

    const totalHours = yearEntries.reduce((s,e) => s + Number(e.hours), 0);
    return totalHours / weekSpan;
  }

  // Draws colored category segments onto a ring's <svg>. fillFraction is
  // how much of the full circle to use (1 = completely filled). Segments
  // are sized proportionally to each category's positive share of the
  // total; categories at or below $0 don't get a visible segment.
  function paintRing(svgId, categories, fillFraction, radius){
    const svg = document.getElementById(svgId);
    if(!svg) return;
    svg.querySelectorAll('.ring-segment').forEach(el => el.remove());

    const circumference = 2 * Math.PI * radius;
    const positiveSum = CATEGORIES.reduce((s,c) => s + Math.max(0, Number(categories[c.key]) || 0), 0);
    if(positiveSum <= 0) return;

    let cumulative = 0;
    CATEGORIES.forEach(c => {
      const val = Math.max(0, Number(categories[c.key]) || 0);
      if(val <= 0) return;
      const share = (val / positiveSum) * fillFraction;
      const segLen = share * circumference;
      const seg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      seg.setAttribute('class', 'ring-segment');
      seg.setAttribute('cx', '100');
      seg.setAttribute('cy', '100');
      seg.setAttribute('r', String(radius));
      seg.setAttribute('stroke', c.color);
      seg.setAttribute('stroke-dasharray', `${segLen} ${circumference - segLen}`);
      seg.setAttribute('stroke-dashoffset', String(-cumulative));
      svg.appendChild(seg);
      cumulative += segLen;
    });
  }

  function renderBudget(monthTotal){
    if(!budgetData) return;
    const cats = budgetData.categories || emptyCategories();
    const total = Number(budgetData.total) || 0;
    const overActive = total > BUDGET_GOAL;

    const budgetRingSvg = document.getElementById('budgetRingSvg');
    const overageHolder = document.getElementById('overageHolder');
    const overageFill = document.getElementById('overageFill');
    const overageNumber = document.getElementById('overageNumber');

    if(overActive){
      // Overage Protocol: hide the ring around the main circle, show a
      // second circle with its own full ring (proportioned by category
      // share of the actual total, no longer capped at $3,600).
      budgetRingSvg.style.display = 'none';
      overageHolder.style.display = 'flex';
      paintRing('overageRingSvg', cats, 1, BUDGET_RING_R);

      // Visual-only "overage number": the dollar overage scaled down by 40.
      // The real dollar figures (in `entries`/`budgetData`) are untouched.
      const rawOverage = total - BUDGET_GOAL;
      const overageNumberValue = rawOverage / 40;
      overageNumber.textContent = truncNum(overageNumberValue);

      const hoursOverage = monthTotal > GOAL ? monthTotal - GOAL : 0;
      overageFill.classList.toggle('overage-safe', overageNumberValue <= hoursOverage);
    } else {
      budgetRingSvg.style.display = '';
      overageHolder.style.display = 'none';
      overageFill.classList.remove('overage-safe');
      const frac = Math.max(0, Math.min(1, total / BUDGET_GOAL));
      paintRing('budgetRingSvg', cats, frac, BUDGET_RING_R);
    }
  }

  function render(){
    const all = entries;
    const monthEntries = entriesForCurrentMonth(all);
    const monthTotal = monthEntries.reduce((s,e) => s + Number(e.hours), 0);

    renderBudget(monthTotal);

    // ---- Circle ----
    const circleFill = document.getElementById('circleFill');
    const circleNumber = document.getElementById('circleNumber');
    const circleCaption = document.getElementById('circleCaption');
    const ring = document.getElementById('ringProgress');
    ring.style.strokeDasharray = `${RING_CIRC}`;

    const isOver = monthTotal >= GOAL;
    if(isOver){
      circleFill.classList.add('over-goal');
      const overage = monthTotal - GOAL;
      circleNumber.textContent = truncNum(overage);
      circleCaption.textContent = 'Good job!';
      circleCaption.classList.remove('hidden');
      ring.style.stroke = 'var(--dandelion-deep)';
      ring.style.strokeDashoffset = 0;
    } else {
      circleFill.classList.remove('over-goal');
      const remaining = GOAL - monthTotal;
      circleNumber.textContent = truncNum(remaining);
      circleCaption.textContent = '';
      circleCaption.classList.add('hidden');
      ring.style.stroke = 'var(--skyblue-deep)';
      const frac = Math.min(1, monthTotal / GOAL);
      ring.style.strokeDashoffset = RING_CIRC * (1 - frac);
    }

    // ---- Confetti calendar background when over goal ----
    document.querySelector('.calendar-section').classList.toggle('confetti-bg', isOver);

    // ---- Weekly widgets ----
    const weekStart = startOfWeek(now);
    const weekEnd = endOfWeek(now);
    const weekTotal = all.reduce((s,e) => {
      const d = new Date(e.date + 'T00:00:00');
      return (d >= weekStart && d <= weekEnd) ? s + Number(e.hours) : s;
    }, 0);
    const weekValue = document.getElementById('weekValue');
    const weekWidget = document.getElementById('weekWidget');
    weekValue.textContent = `${truncNum(weekTotal)}h`;
    weekWidget.classList.toggle('alert', weekTotal > 29);

    const avgWeekly = computeYearlyWeeklyAvg(all);
    const avgValue = document.getElementById('avgValue');
    const avgWidget = document.getElementById('avgWidget');
    avgValue.textContent = `${truncNum(avgWeekly)}h`;
    avgWidget.classList.toggle('alert', avgWeekly > 29);

    // ---- Calendar ----
    buildCalendar(monthEntries);
  }

  function buildCalendar(monthEntries){
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const dows = ['S','M','T','W','T','F','S'];
    dows.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    // aggregate entries by day-of-month
    const byDay = {};
    monthEntries.forEach(e => {
      const d = new Date(e.date + 'T00:00:00');
      const day = d.getDate();
      if(!byDay[day]) byDay[day] = { hours: 0, descs: [] };
      byDay[day].hours += Number(e.hours);
      byDay[day].descs.push(e.description);
    });

    const firstDay = new Date(curYear, curMonth, 1).getDay();
    const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
    const todayDate = now.getDate();
    const isCurrentRealMonth = (curYear === new Date().getFullYear() && curMonth === new Date().getMonth());

    const maxHours = Math.max(1, ...Object.values(byDay).map(v => v.hours));

    for(let i=0; i<firstDay; i++){
      const el = document.createElement('div');
      el.className = 'cal-cell empty';
      grid.appendChild(el);
    }

    for(let day=1; day<=daysInMonth; day++){
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      cell.textContent = day;
      if(isCurrentRealMonth && day === todayDate) cell.classList.add('today');

      const info = byDay[day];
      if(info){
        cell.classList.add('logged');
        const intensity = Math.min(1, info.hours / Math.max(maxHours, 8));
        const lightness = 88 - Math.round(intensity * 48); // 88% (light) down to ~40%
        cell.style.background = `hsl(155, 45%, ${lightness}%)`;
        if(lightness < 55) cell.style.color = '#EAF7F1';

        cell.addEventListener('mouseenter', (ev) => showTooltip(ev, info));
        cell.addEventListener('mousemove', positionTooltip);
        cell.addEventListener('mouseleave', hideTooltip);
        cell.addEventListener('click', (ev) => {
          ev.stopPropagation();
          showTooltip(ev, info);
          setTimeout(() => document.addEventListener('click', hideTooltip, { once:true }), 0);
        });
      }
      grid.appendChild(cell);
    }
  }

  const tooltip = document.getElementById('tooltip');
  function showTooltip(ev, info){
    document.getElementById('ttHours').textContent = `${truncNum(info.hours)} hours logged`;
    document.getElementById('ttDesc').textContent = info.descs.join(' · ');
    tooltip.classList.add('show');
    positionTooltip(ev);
  }
  function positionTooltip(ev){
    const x = ev.clientX;
    const y = ev.clientY;
    const ttW = 220;
    let left = x + 14;
    if(left + ttW > window.innerWidth - 10) left = x - ttW - 14;
    tooltip.style.left = left + 'px';
    tooltip.style.top = (y + 14) + 'px';
  }
  function hideTooltip(){
    tooltip.classList.remove('show');
  }

  // ---- Modal (hours) ----
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('circleFill').addEventListener('click', () => {
    overlay.classList.add('open');
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  function closeModal(){
    overlay.classList.remove('open');
    document.getElementById('logForm').reset();
    document.getElementById('fDate').value = dateKey(new Date());
  }

  document.getElementById('logForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const date = document.getElementById('fDate').value;
    const hours = parseFloat(document.getElementById('fHours').value);
    const description = document.getElementById('fDesc').value.trim();
    if(!date || isNaN(hours) || hours <= 0 || !description) return;

    const updated = entries.slice();
    updated.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,8),
      date, hours, description,
      loggedAt: new Date().toISOString()
    });
    entries = updated;
    persist();
    closeModal();
    render();

    const circleFill = document.getElementById('circleFill');
    circleFill.classList.add('circle-pop');
    setTimeout(() => circleFill.classList.remove('circle-pop'), 460);
  });

  // ---- Modal (money / budget) ----
  const budgetOverlay = document.getElementById('budgetModalOverlay');
  document.getElementById('logOpenBtn').addEventListener('click', () => {
    budgetOverlay.classList.add('open');
  });
  document.getElementById('budgetCancelBtn').addEventListener('click', closeBudgetModal);
  budgetOverlay.addEventListener('click', (e) => { if(e.target === budgetOverlay) closeBudgetModal(); });
  function closeBudgetModal(){
    budgetOverlay.classList.remove('open');
    document.getElementById('budgetForm').reset();
  }

  document.getElementById('budgetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('bAmount').value);
    const category = document.getElementById('bCategory').value;
    if(isNaN(amount) || !CATEGORIES.some(c => c.key === category)) return;

    applyBudgetRollover(); // in case the month turned over since page load
    budgetData.categories[category] = (Number(budgetData.categories[category]) || 0) + amount;
    budgetData.total = (Number(budgetData.total) || 0) + amount;
    persist();
    closeBudgetModal();
    render();
  });

  // ---- Confetti ----
  const confettiColors = ['#FFD166','#FF8577','#AEE6D3','#AAD4F5','#FFD6E8','#C9B6F2'];
  function spawnConfetti(){
    const layer = document.getElementById('confettiLayer');
    const circleFillEl = document.getElementById('circleFill');
    if(!layer || !circleFillEl) return;
    const rect = circleFillEl.getBoundingClientRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;
    const spreadX = window.innerWidth * 0.46;
    const spreadY = window.innerHeight * 0.42;

    for(let i=0; i<90; i++){
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      const angle = Math.random() * Math.PI * 2;
      const reach = 0.45 + Math.random() * 0.65; // vary how far each piece travels
      const tx = Math.cos(angle) * spreadX * reach;
      const ty = Math.sin(angle) * spreadY * reach - spreadY * 0.15;
      const rot = Math.round(Math.random() * 900 - 450);
      piece.style.left = originX + 'px';
      piece.style.top = originY + 'px';
      piece.style.setProperty('--tx', tx + 'px');
      piece.style.setProperty('--ty', ty + 'px');
      piece.style.setProperty('--rot', rot + 'deg');
      piece.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      piece.style.animationDelay = Math.round(Math.random() * 140) + 'ms';
      layer.appendChild(piece);
      setTimeout(() => piece.remove(), 1550);
    }
  }
  document.getElementById('circleFill').addEventListener('mouseenter', () => {
    if(document.getElementById('circleFill').classList.contains('over-goal')){
      spawnConfetti();
    }
  });

  // ---- Cloud sync init ----
  async function initSync(){
    const configured = !!(firebaseConfig.apiKey && firebaseConfig.projectId);
    if(configured){
      try{
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
        const { getFirestore, doc, onSnapshot, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "hourTracker", SYNC_KEY);

        cloudEnabled = true;
        persist = async () => {
          writeLocal(entries);
          writeLocalBudget(budgetData);
          writeLocalBudgetArchive(budgetArchive);
          try{
            await setDoc(docRef, { entries, budget: budgetData, budgetArchive, updatedAt: Date.now() });
          }catch(e){
            console.error('Cloud save failed, changes are saved locally only for now.', e);
          }
        };

        // Prime instantly from local cache, then listen for live updates.
        entries = mergedLocal();
        budgetData = readLocalBudget();
        budgetArchive = readLocalBudgetArchive();
        if(applyBudgetRollover()) persist();
        render();
        setSyncBadge();

        onSnapshot(docRef, snap => {
          const data = snap.exists() ? snap.data() : null;
          const cloudEntries = (data && Array.isArray(data.entries)) ? data.entries : [];
          entries = cloudEntries;
          budgetData = (data && data.budget) ? data.budget : { month: currentMonthKey(), categories: emptyCategories(), total: 0 };
          budgetArchive = (data && data.budgetArchive) ? data.budgetArchive : {};
          writeLocal(cloudEntries);
          writeLocalBudget(budgetData);
          writeLocalBudgetArchive(budgetArchive);
          const rolled = applyBudgetRollover();
          render();
          if(rolled) persist();
        }, err => {
          console.error('Firestore sync error, using local data.', err);
        });
        return;
      }catch(e){
        console.error('Firebase init failed, falling back to local storage only.', e);
      }
    }
    // Local-only fallback (no config, or Firebase failed to load)
    cloudEnabled = false;
    entries = mergedLocal();
    budgetData = readLocalBudget();
    budgetArchive = readLocalBudgetArchive();
    if(applyBudgetRollover()) persist();
    render();
    setSyncBadge();
  }

  // ---- Lock screen ----
  // Change this to your own 5-digit code.
  const ACCESS_CODE = '83364';
  const UNLOCK_KEY = 'hourTrackerUnlocked_v1';

  function showLock(){
    document.body.classList.add('app-locked');
    document.getElementById('lockOverlay').classList.add('show');
    const input = document.getElementById('lockInput');
    input.value = '';
    setTimeout(() => input.focus(), 50);
  }
  function hideLock(){
    document.body.classList.remove('app-locked');
    document.getElementById('lockOverlay').classList.remove('show');
  }
  function attemptUnlock(){
    const input = document.getElementById('lockInput');
    const err = document.getElementById('lockError');
    if(input.value.trim() === ACCESS_CODE){
      sessionStorage.setItem(UNLOCK_KEY, '1');
      err.textContent = '';
      hideLock();
      initSync();
    } else {
      err.textContent = 'Incorrect code';
      input.value = '';
      input.classList.remove('shake');
      void input.offsetWidth; // restart animation
      input.classList.add('shake');
      input.focus();
    }
  }
  document.getElementById('lockForm').addEventListener('submit', (e) => {
    e.preventDefault();
    attemptUnlock();
  });

  if(sessionStorage.getItem(UNLOCK_KEY) === '1'){
    initSync();
  } else {
    showLock();
  }
</script>
