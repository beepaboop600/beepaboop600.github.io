<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive · Ways of Survival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#06060F;
    --panel:rgba(16,19,38,0.86);
    --panel-solid:#101326;
    --sys:#7FE6F5;
    --sys-dim:rgba(127,230,245,0.30);
    --sys-faint:rgba(127,230,245,0.10);
    --gold:#F2C14E;
    --gold-dim:rgba(242,193,78,0.35);
    --jade:#68E0AC;
    --scarlet:#FF5C6E;
    --violet:#A98BFF;
    --ink:#E9EDFF;
    --muted:#8C95C4;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 60% 40% at 18% 8%, rgba(127,230,245,0.11) 0%, transparent 60%),
      radial-gradient(ellipse 55% 45% at 88% 16%, rgba(169,139,255,0.13) 0%, transparent 62%),
      radial-gradient(ellipse 70% 40% at 45% 58%, rgba(93,110,210,0.10) 0%, transparent 65%),
      radial-gradient(ellipse 60% 35% at 60% 100%, rgba(242,193,78,0.07) 0%, transparent 60%),
      var(--void);
    background-attachment: fixed;
    font-family:'Chakra Petch', sans-serif;
    color: var(--ink);
    padding: 20px 16px 70px;
    font-size: 15px;
  }

  /* constellation sky */
  .sky{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .sky svg{ width:100%; height:100%; display:block; }
  .sky .star{ fill:#FFFFFF; }
  .sky .twinkle{ animation: twinkle 4s ease-in-out infinite; }
  @keyframes twinkle{
    0%,100%{ opacity: var(--o, 0.6); }
    50%{ opacity: calc(var(--o, 0.6) * 0.25); }
  }
  .sky .c-line{ stroke: rgba(127,230,245,0.30); stroke-width:0.9; fill:none; }
  .sky .c-star{ fill:#DCF4FF; filter: drop-shadow(0 0 4px rgba(127,230,245,0.9)); }
  .sky .c-star.bright{ fill:#FFF3D0; filter: drop-shadow(0 0 7px rgba(242,193,78,0.85)); }
  .sky .c-name{
    fill: rgba(127,230,245,0.30);
    font-family:'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.22em;
  }

  .wrap{ max-width: 860px; margin: 0 auto; position:relative; z-index:1; }

  .top-row{
    display:flex; align-items:center; justify-content:space-between;
    gap: 12px; margin-bottom: 8px;
  }
  .back-btn{
    text-decoration:none;
    font-weight:600; font-size: 12.5px; letter-spacing: 0.14em;
    color: var(--sys);
    background: rgba(127,230,245,0.06);
    border: 1px solid var(--sys-dim);
    padding: 10px 18px;
    border-radius: var(--radius);
    white-space:nowrap;
    transition: background 0.2s ease;
  }
  .back-btn:hover{ background: rgba(127,230,245,0.18); }

  h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size: clamp(20px, 4.6vw, 30px);
    letter-spacing: 0.04em;
    margin: 0;
    text-align:center;
    flex:1;
    text-shadow: 0 0 26px rgba(127,230,245,0.3);
  }
  .spacer{ width: 96px; }

  .summary-bar{
    text-align:center;
    color: var(--muted);
    font-size: 12.5px;
    letter-spacing: 0.12em;
    margin-bottom: 22px;
  }

  .sync-wrap{ text-align:center; margin-bottom: 26px; }
  .sync-badge{
    display:inline-block; font-size: 11px; letter-spacing: 0.12em;
    color: var(--muted); border: 1px solid var(--sys-faint);
    padding: 5px 14px; border-radius: var(--radius);
  }
  .sync-hint{
    max-width: 380px; margin: 8px auto 0;
    font-size: 11px; color: var(--muted); line-height:1.5;
  }

  /* LOCK SCREEN */
  body.app-locked > *:not(.lock-overlay){
    filter: blur(14px); pointer-events:none; user-select:none;
  }
  .lock-overlay{
    position:fixed; inset:0; z-index:99999; display:none;
    align-items:center; justify-content:center; padding: 20px;
    background: radial-gradient(circle at 50% 40%, rgba(127,230,245,0.10), transparent 60%), var(--void);
  }
  .lock-overlay.show{ display:flex; }
  .lock-card{
    background: var(--panel);
    border: 1px solid var(--sys-dim);
    padding: 34px 28px;
    text-align:center; width:100%; max-width: 320px;
  }
  .lock-emoji{ font-size: 11px; letter-spacing: 0.28em; color: var(--sys); margin-bottom: 10px; }
  .lock-card h2{ font-family:'Cinzel', serif; font-size: 19px; font-weight:600; margin: 0 0 18px; }
  .lock-input{
    width:100%; text-align:center; letter-spacing: 10px;
    font-size: 21px; font-family:'Chakra Petch', sans-serif; font-weight:700;
    padding: 11px 10px;
    border: 1px solid var(--sys-dim);
    background: rgba(9,11,24,0.8);
    color: var(--ink); outline:none;
  }
  .lock-input:focus{ border-color: var(--sys); }
  .lock-input.shake{ animation: lock-shake 0.4s ease; }
  @keyframes lock-shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-8px); }
    75%{ transform: translateX(8px); }
  }
  .lock-error{ min-height: 18px; font-size: 12px; color: var(--scarlet); margin-top: 8px; }

  .lock-field{ text-align:left; margin-bottom: 12px; }
  .lock-field label{
    display:block;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .lock-input.text{
    letter-spacing: normal;
    text-align:left;
    font-size: 14.5px;
  }
  .lock-btn-real[disabled]{ opacity:0.55; cursor:not-allowed; }
  .lock-btn{
    width:100%; margin-top: 12px;
    font-family:'Chakra Petch', sans-serif; font-weight:700;
    font-size: 13px; letter-spacing: 0.1em;
    padding: 12px 14px;
    border-radius: var(--radius); border:none; cursor:pointer;
    background: linear-gradient(135deg, var(--gold), #DFA637);
    color: #12131F;
    transition: transform 0.15s ease;
  }
  .lock-btn:active{ transform: translateY(1px); }

  /* month windows */
  .month-block{
    position:relative;
    background: var(--panel);
    border: 1px solid var(--sys-dim);
    border-radius: var(--radius);
    padding: 20px 18px 16px;
    margin-bottom: 20px;
    backdrop-filter: blur(6px);
  }
  .month-block::before, .month-block::after{
    content:''; position:absolute;
    width: 14px; height: 14px;
    border: 1px solid var(--sys);
    opacity: 0.75; pointer-events:none;
  }
  .month-block::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .month-block::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .month-block h2{
    font-family:'Cinzel', serif;
    font-weight:600; font-size: 18px;
    letter-spacing: 0.05em;
    color: var(--sys);
    margin: 0 0 4px;
  }
  .month-total{
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .budget-summary{
    border: 1px solid var(--sys-faint);
    background: rgba(9,11,24,0.55);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .budget-summary.in-progress{
    border-color: var(--gold-dim);
    background: linear-gradient(120deg, rgba(242,193,78,0.09), transparent 70%);
  }
  .budget-summary-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 10px; flex-wrap: wrap; gap: 6px;
  }
  .budget-summary-title{
    font-family:'Cinzel', serif; font-size: 14px; font-weight:600;
    letter-spacing: 0.06em; color: var(--muted);
  }
  .budget-summary-total{
    font-family:'Cinzel', serif; font-size: 17px; font-weight:700; color: var(--gold);
  }
  .budget-cats{ display:flex; flex-wrap: wrap; gap: 7px; }
  .budget-cat-chip{
    display:inline-flex; align-items:center; gap: 7px;
    border: 1px solid var(--sys-faint);
    background: rgba(255,255,255,0.02);
    border-radius: var(--radius);
    padding: 5px 11px;
    font-size: 11.5px; color: var(--ink);
  }
  .budget-cat-dot{ width: 9px; height: 9px; flex-shrink: 0; }

  table{ width:100%; border-collapse: separate; border-spacing: 0 5px; }
  thead th{
    text-align:left;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    color: var(--muted);
    font-weight:600;
    padding: 0 12px 6px;
  }
  tbody tr td{
    padding: 11px 12px;
    font-size: 13.5px;
    background: rgba(9,11,24,0.6);
    border-top: 1px solid var(--sys-faint);
    border-bottom: 1px solid var(--sys-faint);
  }
  tbody tr td:first-child{
    border-left: 2px solid var(--gold);
    color: var(--gold);
    font-family:'Cinzel', serif;
    font-weight:600;
    white-space:nowrap;
    width: 112px;
  }
  tbody tr td:nth-child(2){
    color: var(--jade);
    font-weight:600;
    text-align:center;
    white-space:nowrap;
    width: 92px;
  }
  tbody tr td:nth-child(3){
    color: var(--ink);
    word-break: break-word;
    line-height:1.5;
  }
  tbody tr td.actions-cell{
    background: transparent;
    border: none;
    width: 40px;
    padding: 11px 4px 11px 6px;
    text-align:center;
  }
  .delete-btn{
    width: 26px; height: 26px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size: 14px; line-height:1;
    cursor: pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .delete-btn:hover{
    color: var(--scarlet);
    background: rgba(255,92,110,0.10);
    border-color: rgba(255,92,110,0.4);
  }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .emoji{
    font-size: 11px; letter-spacing: 0.3em; color: var(--sys);
    display:block; margin-bottom: 12px;
  }
  .empty-state h3{
    font-family:'Cinzel', serif;
    font-weight:600;
    color: var(--ink);
    margin: 0 0 6px;
  }

  @media (max-width: 480px){
    tbody tr td{ font-size: 12.5px; padding: 10px; }
    tbody tr td:first-child{ width: 84px; }
    tbody tr td:nth-child(2){ width: 66px; }
    .spacer{ width: 0; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="sky" id="sky" aria-hidden="true"></div>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-emoji">STAR STREAM</div>
    <h2>Enter Code</h2>
    <form id="lockForm" autocomplete="off">
      <div class="lock-field">
        <label for="lockEmail">EMAIL</label>
        <input type="email" id="lockEmail" class="lock-input text" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="lock-field" style="margin-bottom:4px;">
        <label for="lockPassword">PASSWORD</label>
        <input type="password" id="lockPassword" class="lock-input text" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <div class="lock-error" id="lockError"></div>
      <button type="submit" class="lock-btn lock-btn-real" id="lockSubmitBtn">ENTER</button>
    </form>
  </div>
</div>

<div class="wrap">
  <div class="top-row">
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Archive 🗂️</h1>
    <button class="back-btn" id="signOutBtn" style="border-color:rgba(255,92,110,0.4);color:var(--scarlet);background:rgba(255,92,110,0.06);cursor:pointer;">SIGN OUT</button>
  </div>
  <div class="summary-bar" id="summaryBar"></div>

  <div class="sync-wrap">
    <div class="sync-badge" id="syncBadge">💾 Saved on this device only</div>
    <div class="sync-hint" id="syncHint">Add a Firebase config in the code to sync across devices.</div>
  </div>

  <div id="archiveContent"></div>
</div>

<script type="module">
  // ============================================================
  // CLOUD SYNC CONFIG — paste your Firebase project config below.
  // Must match the same config and SYNC_KEY used in index.html.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyB6YfMs93UjoVAj6Jd0OsOP2FXLf9mAL7Y",
    authDomain: "beepaboop600.firebaseapp.com",
    projectId: "beepaboop600",
    storageBucket: "beepaboop600.firebasestorage.app",
    messagingSenderId: "341983136727",
    appId: "1:341983136727:web:6364e709fe1737e3c75992"
  };
  const SYNC_KEY = "my-hours-tracker";
  // ============================================================

  const STORAGE_KEY = 'hourTrackerEntries_v1';
  const DELETED_KEY = 'hourTrackerDeleted_v1';
  const BUDGET_KEY = 'hourTrackerBudget_v1';
  const BUDGET_ARCHIVE_KEY = 'hourTrackerBudgetArchive_v1';
  const BUDGET_GOAL = 3600;
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const CATEGORIES = [
    { key:'savings',   label:'Savings',    color:'#B79CED' },
    { key:'loans',     label:'Loans',      color:'#4F86C6' },
    { key:'groceries', label:'Groceries',  color:'#6FBE8E' },
    { key:'gas',       label:'Gas',        color:'#FFD166' },
    { key:'food',      label:'Food',       color:'#FF9F5A' },
    { key:'subscription', label:'Subscription', color:'#6B6B84' },
    { key:'other',     label:'Other',      color:'#FF6B6B' }
  ];

  const now = new Date();
  const curYear = now.getFullYear();
  const curMonth = now.getMonth();
  function currentMonthKey(){
    return `${curYear}-${String(curMonth+1).padStart(2,'0')}`;
  }
  function emptyCategories(){
    const c = {};
    CATEGORIES.forEach(cat => c[cat.key] = 0);
    return c;
  }
  function fmtMoney(n){
    const sign = n < 0 ? '-' : '';
    return `${sign}$${Math.abs(Math.round(n * 100) / 100).toFixed(2)}`;
  }

  let entries = [];
  let budgetData = null;
  let budgetArchive = {};
  let cloudEnabled = false;
  let hasSyncedOnce = false;   // true once this device has received a real Firestore snapshot
  let persist = () => { writeLocal(entries); writeLocalBudget(budgetData); writeLocalBudgetArchive(budgetArchive); };

  function readLocal(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function writeLocal(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function readDeletedIds(){
    try{
      const raw = localStorage.getItem(DELETED_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveDeletedIds(ids){
    localStorage.setItem(DELETED_KEY, JSON.stringify(ids));
  }
  // Collapse every entries[] item that shares a date into one record, with
  // hours summed and descriptions joined. Mirrors index.html's version so
  // both pages agree on the merged shape. Idempotent.
  function mergeEntriesByDate(list){
    if(!Array.isArray(list) || list.length === 0) return [];
    const byDate = new Map();
    list.forEach(e => {
      const key = e.date;
      if(!key) return;
      if(!byDate.has(key)){
        byDate.set(key, {
          id: e.id,
          date: key,
          hours: 0,
          descs: [],
          subScenarios: [],
          count: 0,
          loggedAt: e.loggedAt || new Date().toISOString()
        });
      }
      const b = byDate.get(key);
      b.hours += Number(e.hours) || 0;
      if(e.description) b.descs.push(e.description);
      if(Number(e.scenarioNo)) b.subScenarios.push(Number(e.scenarioNo));
      if(Array.isArray(e.subScenarios)) b.subScenarios.push(...e.subScenarios.map(Number).filter(Boolean));
      b.count += Number(e.count) || 1;
      if(e.loggedAt && e.loggedAt > b.loggedAt) b.loggedAt = e.loggedAt;
    });
    return [...byDate.values()]
      .map(b => ({
        id: b.id,
        date: b.date,
        hours: Math.round(b.hours * 100) / 100,
        description: b.descs.join(' · '),
        episode: true,
        subScenarios: b.subScenarios,
        count: b.count,
        loggedAt: b.loggedAt
      }))
      .sort((a, c) => (a.date < c.date ? -1 : (a.date > c.date ? 1 : 0)));
  }

  function mergedLocal(){
    return mergeEntriesByDate(readLocal());
  }
  function readLocalBudget(){
    try{
      const raw = localStorage.getItem(BUDGET_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function writeLocalBudget(b){
    if(b) localStorage.setItem(BUDGET_KEY, JSON.stringify(b));
  }
  function readLocalBudgetArchive(){
    try{
      const raw = localStorage.getItem(BUDGET_ARCHIVE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function writeLocalBudgetArchive(a){
    localStorage.setItem(BUDGET_ARCHIVE_KEY, JSON.stringify(a || {}));
  }
  // Mirrors the same rollover logic as index.html, so opening the archive
  // first (on a fresh device, say) still closes out a finished month.
  // "Subscription" is the only category that automatically re-applies into
  // the new month; every other category resets to zero.
  function applyBudgetRollover(){
    const key = currentMonthKey();
    if(!budgetData){
      budgetData = { month: key, categories: emptyCategories(), total: 0 };
      return false;
    }
    if(budgetData.month === key) return false;

    const oldTotal = Number(budgetData.total) || 0;
    const oldCats = budgetData.categories || emptyCategories();
    const percentages = {};
    CATEGORIES.forEach(c => {
      const val = Number(oldCats[c.key]) || 0;
      percentages[c.key] = oldTotal !== 0 ? (val / oldTotal) * 100 : 0;
    });
    budgetArchive = Object.assign({}, budgetArchive, {
      [budgetData.month]: { total: oldTotal, categories: oldCats, percentages }
    });

    const freshCategories = emptyCategories();
    const subscriptionCarry = Number(oldCats.subscription) || 0;
    freshCategories.subscription = subscriptionCarry;

    budgetData = { month: key, categories: freshCategories, total: subscriptionCarry };
    return true;
  }

  function setSyncBadge(){
    const badge = document.getElementById('syncBadge');
    const hint = document.getElementById('syncHint');
    if(!badge) return;
    if(cloudEnabled){
      badge.textContent = '☁️ Synced across devices';
      hint.textContent = '';
    } else {
      badge.textContent = '💾 Saved on this device only';
      hint.textContent = 'Add a Firebase config in the code to sync across devices.';
    }
  }

  function fmtNum(n){
    n = Math.round(n * 100) / 100;
    return (n % 1 === 0) ? String(n) : String(n.toFixed(2)).replace(/0+$/,'').replace(/\.$/,'');
  }
  function fmtDate(dstr){
    const d = new Date(dstr + 'T00:00:00');
    const mon = monthNames[d.getMonth()].slice(0,3);
    return `${mon} ${d.getDate()}`;
  }

  const summaryBar = document.getElementById('summaryBar');
  const content = document.getElementById('archiveContent');

  function budgetSummaryHtml(label, data, inProgress){
    const total = Number(data.total) || 0;
    const cats = data.categories || emptyCategories();
    const pct = data.percentages || (() => {
      const p = {};
      CATEGORIES.forEach(c => { p[c.key] = total !== 0 ? ((Number(cats[c.key])||0) / total) * 100 : 0; });
      return p;
    })();
    const chips = CATEGORIES.map(c => {
      const val = Number(cats[c.key]) || 0;
      const p = Number(pct[c.key]) || 0;
      return `<span class="budget-cat-chip"><span class="budget-cat-dot" style="background:${c.color};"></span>${c.label} ${fmtMoney(val)} · ${p.toFixed(1)}%</span>`;
    }).join('');
    return `
      <div class="budget-summary${inProgress ? ' in-progress' : ''}">
        <div class="budget-summary-head">
          <span class="budget-summary-title">${label}${inProgress ? ' (in progress)' : ''}</span>
          <span class="budget-summary-total">${fmtMoney(total)}${!inProgress && total > BUDGET_GOAL ? ` <span style="color:#FF5C6E;">(${fmtMoney(total - BUDGET_GOAL)} over)</span>` : ''}</span>
        </div>
        <div class="budget-cats">${chips}</div>
      </div>`;
  }

  function renderArchive(){
    const curKey = currentMonthKey();
    const hasCurrentBudget = budgetData && Number(budgetData.total) !== 0;
    const hasArchivedBudget = Object.keys(budgetArchive).length > 0;
    const hasAnyData = entries.length > 0 || hasArchivedBudget || hasCurrentBudget;

    if(!hasAnyData){
      summaryBar.textContent = '';
      content.innerHTML = `
        <div class="empty-state">
          <span class="emoji">RECORD EMPTY</span>
          <h3>No episodes filed yet</h3>
          <div>Log some hours or money from the main page and they'll show up here forever.</div>
        </div>`;
      return;
    }

    const totalHours = entries.reduce((s,e) => s + Number(e.hours), 0);
    summaryBar.textContent = entries.length
      ? `${entries.length} entries logged · ${fmtNum(totalHours)} total hours`
      : '';

    // group hours by year-month
    const groups = {};
    entries.forEach(e => {
      const d = new Date(e.date + 'T00:00:00');
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if(!groups[key]) groups[key] = [];
      groups[key].push(e);
    });

    // union of months that have hours and/or an archived budget snapshot
    const allKeys = new Set([...Object.keys(groups), ...Object.keys(budgetArchive)]);
    const sortedKeys = Array.from(allKeys).sort().reverse(); // most recent month first

    content.innerHTML = '';

    // live, still-accumulating current month budget (if it has anything logged)
    if(hasCurrentBudget && !sortedKeys.includes(curKey)){
      const liveBlock = document.createElement('div');
      liveBlock.className = 'month-block';
      const [y, m] = curKey.split('-').map(Number);
      liveBlock.innerHTML = `<h2>${monthNames[m-1]} ${y}</h2>` + budgetSummaryHtml('Budget', budgetData, true);
      content.appendChild(liveBlock);
    }

    sortedKeys.forEach(key => {
      const [y, m] = key.split('-').map(Number);
      const list = (groups[key] || []).slice().sort((a,b) => a.date.localeCompare(b.date));
      const monthTotal = list.reduce((s,e) => s + Number(e.hours), 0);
      const isCurrent = key === curKey;
      const budgetForMonth = isCurrent ? budgetData : budgetArchive[key];

      const block = document.createElement('div');
      block.className = 'month-block';

      const hoursSection = list.length ? `
        <div class="month-total">${fmtNum(monthTotal)} hours logged across ${list.length} ${list.length === 1 ? 'entry' : 'entries'}</div>
        <table>
          <thead>
            <tr><th>Date</th><th>Hours</th><th>Task Description</th><th></th></tr>
          </thead>
          <tbody>
            ${list.map(e => `
              <tr data-id="${e.id}">
                <td>${fmtDate(e.date)}</td>
                <td>${fmtNum(Number(e.hours))}h</td>
                <td>${escapeHtml(e.description)}</td>
                <td class="actions-cell"><button class="delete-btn" type="button" data-id="${e.id}" aria-label="Delete entry" title="Delete entry">&times;</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>` : `<div class="month-total">No hours logged this month</div>`;

      const budgetSection = budgetForMonth
        ? budgetSummaryHtml('Budget', budgetForMonth, isCurrent)
        : '';

      block.innerHTML = `<h2>${monthNames[m-1]} ${y}</h2>${budgetSection}${hoursSection}`;
      content.appendChild(block);
    });
  }

  content.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.delete-btn');
    if(!btn) return;
    const id = btn.getAttribute('data-id');
    if(!confirm('Delete this entry? This cannot be undone.')) return;
    const remaining = entries.filter(e => String(e.id) !== String(id));
    entries = remaining;
    persist();
    const deleted = readDeletedIds();
    if(!deleted.includes(String(id))){
      deleted.push(String(id));
      saveDeletedIds(deleted);
    }
    renderArchive();
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Firebase app (shared by Auth and Firestore — initialize exactly once) ----
  let firebaseApp = null;
  async function ensureFirebaseApp(){
    if(firebaseApp) return firebaseApp;
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    firebaseApp = initializeApp(firebaseConfig);
    return firebaseApp;
  }

  // ---- Cloud sync init ----
  async function initSync(){
    const configured = !!(firebaseConfig.apiKey && firebaseConfig.projectId);
    if(configured){
      try{
        const app = await ensureFirebaseApp();
        const { getFirestore, doc, onSnapshot, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        const db = getFirestore(app);
        const docRef = doc(db, "hourTracker", SYNC_KEY);

        cloudEnabled = true;
        persist = async () => {
          writeLocal(entries);
          writeLocalBudget(budgetData);
          writeLocalBudgetArchive(budgetArchive);

          // Never push to the cloud before this device has seen what's
          // actually there — see the matching note in index.html. Local
          // saves above still happen immediately regardless.
          if(!hasSyncedOnce) return;

          try{
            // Carry the quest board through untouched — this page doesn't
            // edit it, but a full setDoc would otherwise erase it.
            let openTasks = [], openBag = { items: [], purchases: [] }, openSeq = 1, openPending = [];
            try{ openTasks = JSON.parse(localStorage.getItem('hourTrackerTasks_v1') || '[]'); }catch(e){ openTasks = []; }
            try{ openPending = JSON.parse(localStorage.getItem('hourTrackerPending_v1') || '[]'); }catch(e){ openPending = []; }
            try{ openBag = JSON.parse(localStorage.getItem('hourTrackerBag_v1') || 'null') || openBag; }catch(e){}
            try{ openSeq = Number(localStorage.getItem('hourTrackerSeq_v1')) || 1; }catch(e){}
            await setDoc(docRef, { entries, pending: openPending, tasks: openTasks, bag: openBag, seq: openSeq, budget: budgetData, budgetArchive, updatedAt: Date.now() });
          }catch(e){
            console.error('Cloud save failed, changes are saved locally only for now.', e);
          }
        };

        entries = mergedLocal();
        budgetData = readLocalBudget();
        budgetArchive = readLocalBudgetArchive();
        renderArchive();
        setSyncBadge();

        stopSync = onSnapshot(docRef, snap => {
          // This device has now seen the real cloud state and may push.
          hasSyncedOnce = true;

          const data = snap.exists() ? snap.data() : null;

          // If the cloud document has no entries yet, local history is the
          // one that's actually true — keep it rather than wiping it to
          // match an empty cloud (this was the earlier data-loss bug).
          let repair = false;
          if(data && Array.isArray(data.entries)){
            const merged = mergeEntriesByDate(data.entries);
            repair = repair || merged.length !== data.entries.length;
            entries = merged;
          } else {
            entries = mergedLocal();
            repair = repair || entries.length > 0;
          }

          budgetData = (data && data.budget) ? data.budget : { month: currentMonthKey(), categories: emptyCategories(), total: 0 };
          budgetArchive = (data && data.budgetArchive) ? data.budgetArchive : {};
          writeLocal(entries);
          writeLocalBudget(budgetData);
          writeLocalBudgetArchive(budgetArchive);
          const rolled = applyBudgetRollover();
          renderArchive();
          if(rolled || repair) persist();
        }, err => {
          console.error('Firestore sync error, using local data.', err);
        });
        return;
      }catch(e){
        console.error('Firebase init failed, falling back to local storage only.', e);
      }
    }
    cloudEnabled = false;
    entries = mergedLocal();
    budgetData = readLocalBudget();
    budgetArchive = readLocalBudgetArchive();
    if(applyBudgetRollover()) persist();
    renderArchive();
    setSyncBadge();
  }

  // ---- Authentication (Firebase Auth, email + password — same account as index.html) ----
  let authInstance = null;
  let stopSync = null;
  let syncStarted = false;

  function showLock(){
    document.body.classList.add('app-locked');
    document.getElementById('lockOverlay').classList.add('show');
    setTimeout(() => document.getElementById('lockEmail').focus(), 50);
  }
  function hideLock(){
    document.body.classList.remove('app-locked');
    document.getElementById('lockOverlay').classList.remove('show');
  }

  async function initAuth(){
    const configured = !!(firebaseConfig.apiKey && firebaseConfig.projectId);
    if(!configured){
      hideLock();
      initSync();
      return;
    }
    try{
      const app = await ensureFirebaseApp();
      const {
        getAuth, onAuthStateChanged, signInWithEmailAndPassword,
        signOut, setPersistence, browserLocalPersistence
      } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");

      authInstance = getAuth(app);
      await setPersistence(authInstance, browserLocalPersistence);

      onAuthStateChanged(authInstance, (user) => {
        if(user){
          hideLock();
          if(!syncStarted){ syncStarted = true; initSync(); }
        } else {
          syncStarted = false;
          if(stopSync){ stopSync(); stopSync = null; }
          showLock();
        }
      });

      document.getElementById('lockForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('lockEmail').value.trim();
        const password = document.getElementById('lockPassword').value;
        const err = document.getElementById('lockError');
        const btn = document.getElementById('lockSubmitBtn');
        btn.disabled = true;
        const originalLabel = btn.textContent;
        btn.textContent = 'CONNECTING…';
        try{
          await signInWithEmailAndPassword(authInstance, email, password);
          err.textContent = '';
        }catch(ex){
          console.error('Sign-in failed', ex);
          err.textContent = 'Authentication failed';
          const pw = document.getElementById('lockPassword');
          pw.value = '';
          pw.classList.remove('shake');
          void pw.offsetWidth;
          pw.classList.add('shake');
          pw.focus();
        } finally {
          btn.disabled = false;
          btn.textContent = originalLabel;
        }
      });

      const signOutBtn = document.getElementById('signOutBtn');
      if(signOutBtn){
        signOutBtn.addEventListener('click', () => { signOut(authInstance); });
      }
    }catch(e){
      console.error('Firebase Auth failed to load; running local-only for this session.', e);
      hideLock();
      initSync();
    }
  }

  initAuth();

  // ---- constellation sky (mirrors the tracker page) ----
  (function buildSky(){
    const host = document.getElementById('sky');
    if(!host) return;
    const SHAPES = [
      { name:'THE DIPPER', pts:[[0,0.55],[0.2,0.38],[0.42,0.3],[0.62,0.42],[0.6,0.7],[0.38,0.82],[0.18,0.74],[0,0.55]], bright:[2] },
      { name:'CASSIOPEIA', pts:[[0,0.2],[0.24,0.72],[0.5,0.22],[0.76,0.75],[1,0.28]], bright:[2] },
      { name:'THE READER', pts:[[0.5,0],[0.22,0.26],[0.5,0.44],[0.78,0.26],[0.5,0.44],[0.5,0.82],[0.28,1],[0.5,0.82],[0.74,1]], bright:[0,5] },
      { name:'LYRA', pts:[[0.1,0.08],[0.46,0.3],[0.28,0.62],[0.62,0.78],[0.9,0.5],[0.46,0.3]], bright:[0] },
      { name:'THE WALL', pts:[[0,0.86],[0.16,0.4],[0.4,0.62],[0.58,0.14],[0.78,0.5],[1,0.2]], bright:[3] },
      { name:'SCORPIUS', pts:[[0,0.12],[0.2,0.3],[0.42,0.4],[0.6,0.56],[0.72,0.8],[0.9,0.74],[0.94,0.5]], bright:[2] },
      { name:'THE ARK', pts:[[0.05,0.3],[0.3,0.68],[0.62,0.74],[0.9,0.42],[0.62,0.74],[0.5,1]], bright:[3] },
      { name:'ORION', pts:[[0.16,0.05],[0.82,0.12],[0.34,0.44],[0.5,0.5],[0.66,0.56],[0.2,0.92],[0.86,0.86],[0.66,0.56]], bright:[3] }
    ];
    const PLACE = [
      { x:0.05, y:0.04, w:0.22, h:0.16 }, { x:0.70, y:0.02, w:0.24, h:0.13 },
      { x:0.38, y:0.16, w:0.20, h:0.24 }, { x:0.06, y:0.34, w:0.16, h:0.18 },
      { x:0.76, y:0.32, w:0.20, h:0.20 }, { x:0.30, y:0.58, w:0.22, h:0.18 },
      { x:0.04, y:0.68, w:0.20, h:0.18 }, { x:0.68, y:0.66, w:0.26, h:0.24 }
    ];
    const W = 1000, H = 1000;
    let seed = 20260916;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const parts = [];
    for(let i=0;i<220;i++){
      const x = rnd()*W, y = rnd()*H, r = 0.6 + rnd()*1.5;
      const o = (0.25 + rnd()*0.6).toFixed(2);
      const tw = rnd() > 0.72;
      parts.push(`<circle class="star${tw?' twinkle':''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" style="--o:${o};opacity:${o};animation-delay:${(rnd()*4).toFixed(2)}s"/>`);
    }
    SHAPES.forEach((shape, i) => {
      const box = PLACE[i % PLACE.length];
      const pts = shape.pts.map(([px,py]) => [(box.x + px*box.w)*W, (box.y + py*box.h)*H]);
      parts.push(`<path class="c-line" d="${pts.map((p,k)=>`${k?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}"/>`);
      pts.forEach((p,k) => {
        const b = shape.bright.includes(k);
        parts.push(`<circle class="c-star${b?' bright':''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${b?2.6:1.8}"/>`);
      });
      const low = pts.reduce((a,b) => (b[1] > a[1] ? b : a));
      parts.push(`<text class="c-name" x="${low[0].toFixed(1)}" y="${(low[1]+16).toFixed(1)}" text-anchor="middle">${shape.name}</text>`);
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
  })();

</script>
