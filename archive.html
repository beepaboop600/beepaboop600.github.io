<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive · Hours Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6ED;
    --panel:#FFFFFF;
    --lavender:#F0EAFB;
    --lavender-line:#E4DAF7;
    --dandelion:#FFD166;
    --dandelion-deep:#F5B93F;
    --mint:#AEE6D3;
    --mint-deep:#7FCDBB;
    --coral-bg:#FFE3E0;
    --pink:#FFD6E8;
    --plum:#4A3F55;
    --plum-soft:#8B7F99;
    --row-a: #FBF6ED;
    --row-b: #F3F8F6;
    --shadow: 0 10px 30px rgba(74,63,85,0.12);
    --radius-lg: 26px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 10%, #FFF1DA 0%, transparent 40%),
      radial-gradient(circle at 92% 6%, #E7F7F1 0%, transparent 38%),
      radial-gradient(circle at 85% 92%, #F5E9FF 0%, transparent 42%),
      var(--cream);
    font-family:'Quicksand', sans-serif;
    color: var(--plum);
    padding: 18px 16px 60px;
  }
  .wrap{ max-width: 820px; margin: 0 auto; }

  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    margin-bottom: 22px;
  }
  .back-btn{
    text-decoration:none;
    font-weight:700;
    font-size: 14px;
    color: var(--plum);
    background: var(--lavender);
    border: 2px solid var(--lavender-line);
    padding: 10px 18px;
    border-radius: 999px;
    white-space:nowrap;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .back-btn:hover{ background:#E5DBFB; transform: translateY(-2px); }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-size: clamp(22px, 5vw, 28px);
    margin: 0;
    text-align:center;
    flex:1;
  }
  .spacer{ width: 84px; }

  .summary-bar{
    text-align:center;
    color: var(--plum-soft);
    font-weight:600;
    font-size: 13.5px;
    margin-bottom: 26px;
  }

  .sync-badge{
    display:inline-block;
    font-size: 11.5px;
    font-weight:700;
    color: var(--plum-soft);
    background: var(--lavender);
    border: 1px solid var(--lavender-line);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .sync-wrap{
    text-align:center;
    margin-bottom: 26px;
  }
  .sync-hint{
    max-width: 360px;
    margin: 8px auto 0;
    font-size: 11.5px;
    color: var(--plum-soft);
    font-weight:600;
    line-height:1.4;
  }

  /* LOCK SCREEN */
  body.app-locked > *:not(.lock-overlay){
    filter: blur(14px);
    pointer-events: none;
    user-select: none;
  }
  .lock-overlay{
    position:fixed;
    inset:0;
    z-index: 99999;
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    background:
      radial-gradient(circle at 8% 10%, #FFF1DA 0%, transparent 40%),
      radial-gradient(circle at 92% 6%, #E7F7F1 0%, transparent 38%),
      radial-gradient(circle at 85% 92%, #F5E9FF 0%, transparent 42%),
      var(--cream);
  }
  .lock-overlay.show{ display:flex; }
  .lock-card{
    background: var(--panel);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 34px 28px;
    text-align:center;
    width: 100%;
    max-width: 300px;
  }
  .lock-emoji{ font-size: 34px; margin-bottom: 8px; }
  .lock-card h2{
    font-family:'Baloo 2', sans-serif;
    font-size: 20px;
    margin: 0 0 18px;
  }
  .lock-input{
    width:100%;
    text-align:center;
    letter-spacing: 10px;
    font-size: 22px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    padding: 12px 10px;
    border-radius: 14px;
    border: 2px solid var(--lavender-line);
    background: var(--lavender);
    color: var(--plum);
    outline:none;
  }
  .lock-input:focus{ border-color: var(--dandelion-deep); }
  .lock-input.shake{ animation: lock-shake 0.4s ease; }
  @keyframes lock-shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-8px); }
    75%{ transform: translateX(8px); }
  }
  .lock-error{
    min-height: 18px;
    font-size: 12.5px;
    font-weight:700;
    color: #C6483C;
    margin-top: 8px;
  }
  .lock-btn{
    width:100%;
    margin-top: 12px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 14.5px;
    padding: 12px 14px;
    border-radius: 999px;
    border:none;
    cursor:pointer;
    background: linear-gradient(135deg, var(--dandelion), var(--dandelion-deep));
    color: #4A3510;
    transition: transform 0.15s ease;
  }
  .lock-btn:hover{ transform: translateY(-1px); }

  .month-block{
    background: var(--panel);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 20px 18px 14px;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .month-block h2{
    font-family:'Baloo 2', sans-serif;
    font-size: 19px;
    margin: 0 0 4px;
  }
  .month-total{
    font-size: 12.5px;
    font-weight:700;
    color: var(--plum-soft);
    margin-bottom: 14px;
  }

  table{
    width:100%;
    border-collapse: separate;
    border-spacing: 0 6px;
  }
  thead th{
    text-align:left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--plum-soft);
    font-weight:700;
    padding: 0 12px 4px;
  }
  tbody tr td{
    padding: 12px 12px;
    font-size: 14px;
    font-weight:600;
  }
  tbody tr td:first-child{
    border-radius: 12px 0 0 12px;
    background: var(--dandelion);
    color: #4A3510;
    white-space:nowrap;
    width: 108px;
  }
  tbody tr td:nth-child(2){
    background: var(--mint);
    color: #1f4a3d;
    text-align:center;
    white-space:nowrap;
    width: 90px;
  }
  tbody tr td:nth-child(3){
    background: var(--lavender);
    color: var(--plum);
    font-weight:600;
    word-break: break-word;
  }
  tbody tr td.actions-cell{
    background: transparent;
    width: 40px;
    padding: 12px 8px 12px 4px;
    text-align:center;
  }
  .delete-btn{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--coral-bg, #FFE3E0);
    color: #C6483C;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .delete-btn:hover{
    background: #FFC9C3;
    transform: scale(1.08);
  }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--plum-soft);
  }
  .empty-state .emoji{ font-size: 40px; display:block; margin-bottom: 10px; }
  .empty-state h3{
    font-family:'Baloo 2', sans-serif;
    color: var(--plum);
    margin: 0 0 6px;
  }

  @media (max-width: 480px){
    tbody tr td{ font-size: 13px; padding: 10px; }
    tbody tr td:first-child{ width: 78px; }
    tbody tr td:nth-child(2){ width: 60px; }
  }
</style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-emoji">🔒</div>
    <h2>Enter Code</h2>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="lockInput" class="lock-input" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" placeholder="•••••" required>
      <div class="lock-error" id="lockError"></div>
      <button type="submit" class="lock-btn">Unlock</button>
    </form>
  </div>
</div>

<div class="wrap">
  <div class="top-row">
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Archive 🗂️</h1>
    <span class="spacer"></span>
  </div>
  <div class="summary-bar" id="summaryBar"></div>

  <div class="sync-wrap">
    <div class="sync-badge" id="syncBadge">💾 Saved on this device only</div>
    <div class="sync-hint" id="syncHint">Add a Firebase config in the code to sync across devices.</div>
  </div>

  <div id="archiveContent"></div>
</div>

<script type="module">
  // ============================================================
  // CLOUD SYNC CONFIG — paste your Firebase project config below.
  // Must match the same config and SYNC_KEY used in index.html.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyB6YfMs93UjoVAj6Jd0OsOP2FXLf9mAL7Y",
    authDomain: "beepaboop600.firebaseapp.com",
    projectId: "beepaboop600",
    storageBucket: "beepaboop600.firebasestorage.app",
    messagingSenderId: "341983136727",
    appId: "1:341983136727:web:6364e709fe1737e3c75992"
  };
  const SYNC_KEY = "my-hours-tracker";
  // ============================================================

  const STORAGE_KEY = 'hourTrackerEntries_v1';
  const DELETED_KEY = 'hourTrackerDeleted_v1';
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  let entries = [];
  let cloudEnabled = false;
  let saveEntries = (list) => { writeLocal(list); };

  function readLocal(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function writeLocal(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function readDeletedIds(){
    try{
      const raw = localStorage.getItem(DELETED_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveDeletedIds(ids){
    localStorage.setItem(DELETED_KEY, JSON.stringify(ids));
  }
  function mergedLocal(){
    return readLocal();
  }

  function setSyncBadge(){
    const badge = document.getElementById('syncBadge');
    const hint = document.getElementById('syncHint');
    if(!badge) return;
    if(cloudEnabled){
      badge.textContent = '☁️ Synced across devices';
      hint.textContent = '';
    } else {
      badge.textContent = '💾 Saved on this device only';
      hint.textContent = 'Add a Firebase config in the code to sync across devices.';
    }
  }

  function fmtNum(n){
    n = Math.round(n * 100) / 100;
    return (n % 1 === 0) ? String(n) : String(n.toFixed(2)).replace(/0+$/,'').replace(/\.$/,'');
  }
  function fmtDate(dstr){
    const d = new Date(dstr + 'T00:00:00');
    const mon = monthNames[d.getMonth()].slice(0,3);
    return `${mon} ${d.getDate()}`;
  }

  const summaryBar = document.getElementById('summaryBar');
  const content = document.getElementById('archiveContent');

  function renderArchive(){
    if(entries.length === 0){
      summaryBar.textContent = '';
      content.innerHTML = `
        <div class="empty-state">
          <span class="emoji">🌱</span>
          <h3>No entries yet</h3>
          <div>Log some hours from the main page and they'll show up here forever.</div>
        </div>`;
      return;
    }

    const totalHours = entries.reduce((s,e) => s + Number(e.hours), 0);
    summaryBar.textContent = `${entries.length} entries logged · ${fmtNum(totalHours)} total hours`;

    // group by year-month
    const groups = {};
    entries.forEach(e => {
      const d = new Date(e.date + 'T00:00:00');
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if(!groups[key]) groups[key] = [];
      groups[key].push(e);
    });

    const sortedKeys = Object.keys(groups).sort().reverse(); // most recent month first

    content.innerHTML = '';
    sortedKeys.forEach(key => {
      const [y, m] = key.split('-').map(Number);
      const list = groups[key].slice().sort((a,b) => a.date.localeCompare(b.date));
      const monthTotal = list.reduce((s,e) => s + Number(e.hours), 0);

      const block = document.createElement('div');
      block.className = 'month-block';
      block.innerHTML = `
        <h2>${monthNames[m-1]} ${y}</h2>
        <div class="month-total">${fmtNum(monthTotal)} hours logged across ${list.length} ${list.length === 1 ? 'entry' : 'entries'}</div>
        <table>
          <thead>
            <tr><th>Date</th><th>Hours</th><th>Task Description</th><th></th></tr>
          </thead>
          <tbody>
            ${list.map(e => `
              <tr data-id="${e.id}">
                <td>${fmtDate(e.date)}</td>
                <td>${fmtNum(Number(e.hours))}h</td>
                <td>${escapeHtml(e.description)}</td>
                <td class="actions-cell"><button class="delete-btn" type="button" data-id="${e.id}" aria-label="Delete entry" title="Delete entry">&times;</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      content.appendChild(block);
    });
  }

  content.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.delete-btn');
    if(!btn) return;
    const id = btn.getAttribute('data-id');
    if(!confirm('Delete this entry? This cannot be undone.')) return;
    const remaining = entries.filter(e => String(e.id) !== String(id));
    entries = remaining;
    saveEntries(remaining);
    const deleted = readDeletedIds();
    if(!deleted.includes(String(id))){
      deleted.push(String(id));
      saveDeletedIds(deleted);
    }
    renderArchive();
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Cloud sync init ----
  async function initSync(){
    const configured = !!(firebaseConfig.apiKey && firebaseConfig.projectId);
    if(configured){
      try{
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
        const { getFirestore, doc, onSnapshot, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "hourTracker", SYNC_KEY);

        cloudEnabled = true;
        saveEntries = async (list) => {
          writeLocal(list);
          try{
            await setDoc(docRef, { entries: list, updatedAt: Date.now() });
          }catch(e){
            console.error('Cloud save failed, changes are saved locally only for now.', e);
          }
        };

        entries = mergedLocal();
        renderArchive();
        setSyncBadge();

        onSnapshot(docRef, snap => {
          const data = snap.exists() ? snap.data() : null;
          const cloudEntries = (data && Array.isArray(data.entries)) ? data.entries : [];
          entries = cloudEntries;
          writeLocal(cloudEntries);
          renderArchive();
        }, err => {
          console.error('Firestore sync error, using local data.', err);
        });
        return;
      }catch(e){
        console.error('Firebase init failed, falling back to local storage only.', e);
      }
    }
    cloudEnabled = false;
    entries = mergedLocal();
    renderArchive();
    setSyncBadge();
  }

  // ---- Lock screen ----
  // Change this to your own 5-digit code (must match index.html).
  const ACCESS_CODE = '83364';
  const UNLOCK_KEY = 'hourTrackerUnlocked_v1';

  function showLock(){
    document.body.classList.add('app-locked');
    document.getElementById('lockOverlay').classList.add('show');
    const input = document.getElementById('lockInput');
    input.value = '';
    setTimeout(() => input.focus(), 50);
  }
  function hideLock(){
    document.body.classList.remove('app-locked');
    document.getElementById('lockOverlay').classList.remove('show');
  }
  function attemptUnlock(){
    const input = document.getElementById('lockInput');
    const err = document.getElementById('lockError');
    if(input.value.trim() === ACCESS_CODE){
      sessionStorage.setItem(UNLOCK_KEY, '1');
      err.textContent = '';
      hideLock();
      initSync();
    } else {
      err.textContent = 'Incorrect code';
      input.value = '';
      input.classList.remove('shake');
      void input.offsetWidth; // restart animation
      input.classList.add('shake');
      input.focus();
    }
  }
  document.getElementById('lockForm').addEventListener('submit', (e) => {
    e.preventDefault();
    attemptUnlock();
  });

  if(sessionStorage.getItem(UNLOCK_KEY) === '1'){
    initSync();
  } else {
    showLock();
  }
</script>
</body>
</html>
